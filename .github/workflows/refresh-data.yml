# Monthly data refresh: newest Overture release, clearest summer Landsat / Sentinel-2 scenes, ASHDODMAP layers.
# A commit to main triggers the Vercel production deploy.
name: refresh-data
on:
  schedule:
    - cron: '17 3 2 * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install rasterio duckdb h3 shapely pyproj numpy scipy
      - name: Fetch sources
        run: |
          python scripts/fetch_muni.py
          REL=$(python scripts/latest_overture.py) && echo "$REL" > data-raw/overture_release.txt
          python scripts/fetch_overture.py "$REL"
          python scripts/fetch_rasters.py "$(date -u +%Y -d '-3 months')"
      - name: Build indicators
        run: python scripts/build_data.py
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Check the app still builds and the statistics still match SciPy
        run: npm install --no-audit --no-fund --legacy-peer-deps && npm test && npm run build
      - name: Commit
        run: |
          git config user.name "korelaztiot-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data data-raw/*.json data-raw/*.txt
          git diff --cached --quiet && echo "no change" || (git commit -m "Monthly data refresh $(date -u +%Y-%m-%d)" && git push)
